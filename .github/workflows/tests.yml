name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q custom_components
      - name: Check bundled transport and license
        run: |
          for f in __init__.py protocol.py exceptions.py types.py LICENSE; do
            test -f "custom_components/mova_nutripal/dreame_cloud/$f"
          done
