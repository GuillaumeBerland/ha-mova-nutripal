add_calibration_measurement:
  target:
    entity:
      integration: mova_nutripal
      domain: sensor
  fields:
    measurement_date:
      required: true
      selector:
        date:
    portions:
      required: true
      selector:
        number:
          min: 1
          max: 100
          step: 1
          mode: box
    daily_counter:
      required: true
      selector:
        number:
          min: 1
          max: 10000
          step: 1
          mode: box
    weight_before:
      required: true
      selector:
        number:
          min: 0
          max: 10000
          step: 0.1
          unit_of_measurement: g
          mode: box
    weight_after:
      required: true
      selector:
        number:
          min: 0
          max: 10000
          step: 0.1
          unit_of_measurement: g
          mode: box
    confirmed:
      required: true
      selector:
        boolean:
record_physical_calibration:
  target:
    entity:
      integration: mova_nutripal
      domain: sensor
  fields:
    measurement_date:
      required: true
      selector:
        date:
    trials:
      required: true
      selector:
        object: {}
    confirmed:
      required: true
      selector:
        boolean:
mark_feeding_day:
  target:
    entity:
      integration: mova_nutripal
      domain: sensor
  fields:
    measurement_date:
      required: true
      selector:
        date:
    reason:
      required: true
      selector:
        text:
save_pet_profile:
  target:
    entity:
      integration: mova_nutripal
      domain: sensor
  fields:
    pet_id:
      required: true
      selector:
        text:
    name:
      required: true
      selector:
        text:
    target_kg:
      selector:
        number:
          min: 0.001
          max: 30
          step: 0.001
          unit_of_measurement: kg
          mode: box
    baseline_date:
      selector:
        date:
record_pet_weights:
  target:
    entity:
      integration: mova_nutripal
      domain: sensor
  fields:
    pet_id:
      required: true
      selector:
        text:
    measurements:
      required: true
      selector:
        object: {}
    replace_existing:
      default: false
      selector:
        boolean:
